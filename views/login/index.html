<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="index.js"></script>
    <link rel="shortcut icon" type="image/x-icon" href="/media/S4U-icon.ico">
    <title>Log In</title>
</head>

<body class="bg-cover bg-center" style="background-image: url('/media/Gradient.jpg');">

    <nav class="bg-taupe-300 px-10 py-3 flex items-center justify-center items-center border border-black shadow-md">
        <h1 class="text-black text-3xl font-bold"><a href="/">Style4U</a></h1>
    </nav>

    <div class="min-h-[calc(100vh-80px)] flex items-center justify-center py-12 px-4">

    <div class="w-full max-w-md bg-taupe-200 backdrop-blur-md rounded-2xl p-8 shadow-2xl border border-black">
        
        <div class="text-center mb-6">
        <h2 class="text-3xl font-bold text-gray-900">Log in into your account</h2>
        <p class="text-sm text-gray-600 mt-1">Welcome back!</p>
        </div>

        <!-- Formulario -->
        <form id="form"
        class="space-y-4">
        
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                Email <span class="text-red-500">*</span>
                </label>
                <input id="email-input"
                type="email" 
                placeholder="Enter your email" 
                class="w-full px-4 py-3 bg-white text-gray-900 border border-gray-300 rounded-xl"
                />
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                <label class="block text-sm font-semibold text-gray-700">
                    Password <span class="text-red-500">*</span>
                </label>
                <a href="#" class="text-xs text-emerald-600 hover:text-emerald-700 font-medium">Forgot password?</a>
                </div>
                <input id="password-input"
                type="password" 
                placeholder="Enter your password" 
                class="w-full px-4 py-3 bg-white text-gray-900 border border-gray-300 rounded-xl"
                />
            </div>

            <p id="error-text" class="text-xs text-red-600 font-semibold text-center min-h-[16px]"></p>

            <button id="form-btn"
                type="submit" 
                class="w-full mt-2 bg-gray-900 hover:bg-black text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 cursor-pointer"
            >
                Log In
            </button>
        </form>

        <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase">
            <span class="bg-white/90 px-3 text-gray-500 font-medium">Or continue with</span>
        </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
        
        <button class="flex items-center justify-center gap-2 px-4 py-2.5 bg-white border border-gray-300 rounded-xl font-medium text-gray-700 hover:bg-gray-50 hover:border-gray-400 shadow-sm transition-all duration-200 hover:-translate-y-0.5">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="text-sm">Google</span>
        </button>

        <button class="flex items-center justify-center gap-2 px-4 py-2.5 bg-white border border-gray-300 rounded-xl font-medium text-gray-700 hover:bg-gray-50 hover:border-gray-400 shadow-sm transition-all duration-200 hover:-translate-y-0.5">
            <svg class="w-5 h-5 fill-current text-gray-900" viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <span class="text-sm">GitHub</span>
        </button>

        </div>

        <p class="text-xs text-center text-gray-600 mt-6">
        Don't have an account? 
        <a href="/signup" class="text-emerald-600 font-bold hover:text-emerald-700 underline">Sign up</a>
        </p>

    </div>
    </div>
    <footer class="bg-black mt-8 w-full py-4 border-t border-gray-300 flex">
        <div class="mx-auto px-4 flex flex-col">
            <img 
                src="/media/LogoStyle4U.svg" 
                class="object-contain h-32"
            />
            <p class="text-xs text-gray-600">
                Style4U &copy; 2024. All rights reserved.
            </p>
        </div>
    </footer>
    
</body>
</html>
