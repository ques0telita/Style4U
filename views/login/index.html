<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" type="image/x-icon" href="/media/S4U-icon.ico">
    <title>Log In</title>
</head>

<body class="bg-cover bg-center" style="background-image: url('media/Gradiente.jpg');">

    <nav id="navbar" class="bg-taupe-300 px-10 py-3 flex items-center justify-between border border-black shadow-md">

        <h1 class="text-black text-3xl font-bold">Style4U</h1>
        <input class="bg-gray-400 rounded-full d-full px-4 py-1 w-1/3 focus:outline-none focus:ring-2 focus:ring-black focus:border-black"
        placeholder="Search"
        type="text"
        >
        
        <div class="flex items-center space-x-6 text-white">
  
            <a href="/"><button class="flex items-center bg-black rounded gap-4 hover:text-indigo-200 transition-colors cursor-pointer focus:outline-none">
                <div class="relative">
                <svg 
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-7 h-7">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-0 2.033-.807 2.22-1.916l1.208-7.25H6.516M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                </svg>
                <span class="absolute -top-1 -right-2 bg-amber-400 text-slate-900 text-xs font-extrabold rounded-full w-4 h-4 flex items-center justify-center">0</span>
                </div>
                <span class="font-semibold text-base p-2">Carrito</span>
            </button>
            </a>

            <a href="/login"><button class="flex items-center bg-black rounded gap-4 hover:text-indigo-200 transition-colors cursor-pointer focus:outline-none">
                <svg 
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-7 h-7">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                </svg>
                <span class="font-semibold text-base p-2">Perfil</span>
            </button>
            </a>
        </div>
    </nav>

    <div class="justify-center flex flex-col items-center h-screen gap-4 py-10">
        <h1 class="text-xl font-bold text-black">Log in into your account</h1>
    <form id="form"
        class="flex pt-6 flex-col gap-4 bg-taupe-300 p-4 rounded-lg text-lg border border-black shadow-lg w-full md:w-9/12 lg:w-2/4"
      >
        <div class="flex flex-col gap-2">
          <label class="font-bold text-black" for="email-input"
            >Email <span class="text-red-500">*</span></label
          >
          <input
            id="email-input"
            type="text"
            name="email-input"
            autocomplete="off"
            placeholder="Enter your email"
            class="rounded-lg p-2 bg-zinc-500 focus:outline-black"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label class="font-bold text-black" for="password-input"
            >Password <span class="text-red-500">*</span></label
          >
          <input
            id="password-input"
            type="password"
            name="password-input"
            autocomplete="off"
            placeholder="Enter your password"
            class="rounded-lg p-2 bg-zinc-500 focus:outline-black"
          />
          <p id="error-text" class="text-sm text-red-600"></p>
        </div>
        <button
          id="form-btn"
          class="bg-black py-2 px-4 rounded-lg font-bold text-white hover:bg-orange-600 text-center transition ease-in-out disabled:opacity-40 disabled:cursor-not-allowed"
        >
          Log In
        </button>
    </form>
        <secction class="">
            <p class="text-black text-lg">Don't have an account? <a href="/signup" class="text-blue-600 hover:underline">Sign up</a>
            </p>
            <div class="flex gap-4">
                <button class="bg-gray-300 border border-black justify-center items-center flex gap-3 p-3 mx-5 rounded hover:bg-gray-400 transiton ease-in-out">
                    Continue with <img src="/media/googlelog.svg" class="w-6 h-6">
                </button>

            </div>
        </secction>
    </div>
</body>
</html>
