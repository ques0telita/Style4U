<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../components/notification.js"></script>
    <script type="module" src="index.js"></script>
    <link rel="shortcut icon" type="image/x-icon" href="/media/S4U-icon.ico">
    <title>Sign Up</title>
</head>
<body class="bg-cover bg-center" style="background-image: url('/media/Gradient.jpg');">

    <nav class="bg-taupe-300 px-10 py-3 flex items-center justify-center items-center border border-black shadow-md">
      <h1 class="text-black text-3xl font-bold"><a href="/">Style4U</a></h1>
    </nav>

    <div id="notification" class="fixed top-20 right-0 left-0"></div>
    
    <!-- Contenedor principal centrado -->
    <div class="min-h-[calc(100vh-80px)] flex items-center justify-center py-12 px-4">

    <!-- Tarjeta de Registro con Glassmorphism / Estilo Limpio -->
    <div class="w-full max-w-md bg-taupe-200 rounded-xl p-8 shadow-2xl border border-black">
    
    <!-- Título dentro de la tarjeta -->
    <div class="text-center mb-6">
      <h2 class="text-3xl font-bold text-gray-900">Create your account</h2>
      <p class="text-sm text-gray-600 mt-1">Join Style4U to start shopping</p>
    </div>

    <!-- Formulario -->
    <form id="form"
    class="space-y-4">
      
      <!-- Campo Name -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">
          Name <span class="text-red-500">*</span>
        </label>
        <input id="name-input"
          type="text" 
          placeholder="Enter your name" 
          class="w-full px-4 py-3 bg-white text-gray-900 border border-gray-300 rounded-xl"
        />
      </div>

      <!-- Campo Email -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">
          Email <span class="text-red-500">*</span>
        </label>
        <input id="email-input"
          type="email" 
          placeholder="example@gmail.com" 
          class="w-full px-4 py-3 bg-white text-gray-900  border border-gray-300 rounded-xl"
        />
      </div>

      <!-- Campo Password -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">
          Password <span class="text-red-500">*</span>
        </label>
        <input id="password-input"
          type="password" 
          placeholder="Enter your password" 
          class="w-full px-4 py-3 bg-white text-gray-900 border border-gray-300 rounded-xl"
        />
      </div>

      <!-- Campo Confirm Password -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">
          Confirm password <span class="text-red-500">*</span>
        </label>
        <input id="match-input"
          type="password" 
          placeholder="Confirm password" 
          class="w-full px-4 py-3 bg-white text-gray-900 border border-gray-300 rounded-xl"
        />
      </div>

      <!-- Botón de Acción Principal -->
      <button id="form-btn"
        type="submit"
        disabled class="w-full mt-2 bg-gray-900 hover:bg-black text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0"
      >
        Sign Up
      </button>

    </form>

    <!-- Términos y Condiciones -->
    <p class="text-xs text-center text-gray-500 mt-6">
      By signing up, you agree to our 
      <a href="#" class="text-emerald-600 underline font-medium hover:text-emerald-700">Terms and Conditions</a>
    </p>
    <!-- Enlace a Registro -->
    <p class="text-xs text-center text-gray-600 mt-6">
      You alredy have an account? 
      <a href="/login" class="text-emerald-600 font-bold hover:text-emerald-700 underline">Log in</a>
    </p>
  </div>
  </div>

  <footer class="bg-black mt-8 w-full py-4 border-t border-gray-300 flex">
    <div class="mx-auto px-4 flex flex-col">
      <img 
      src="/media/LogoStyle4U.svg" 
      class="object-contain h-32"
      />
      <p class="text-xs text-gray-600">
        Style4U &copy; 2024. All rights reserved.
      </p>
    </div>
  </footer>
    
</body>
</html>
